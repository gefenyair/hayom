<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>סורק ההומפייג' | היום</title><style>
:root{font-family:Arial,sans-serif;color:#f4f4f7;background:#101116}*{box-sizing:border-box}body{margin:0}header{background:#191b23;padding:20px 4%;border-bottom:2px solid #bd2036}h1{margin:0;font-size:24px}small{color:#aaa}main{max-width:1280px;margin:auto;padding:24px}nav{display:flex;flex-wrap:wrap;align-items:end;gap:12px;margin-bottom:18px}label{display:grid;gap:7px;font-size:13px}input,select,button,a.action{background:#272a35;border:1px solid #414555;color:white;border-radius:9px;padding:11px;font-size:15px}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}.viewer{background:#1a1c25;border:1px solid #353846;border-radius:14px;padding:16px}.viewer iframe{display:block;width:100%;height:70vh;border:0;background:white;border-radius:8px}.empty{padding:100px 20px;text-align:center;color:#bbb}.times{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0}.times button.active{background:#b92339;border-color:#e0495e}a.action{text-decoration:none}#status{color:#bbb;font-size:14px;margin:10px 0}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:12px}.comparison iframe{height:65vh}@media(max-width:700px){.comparison{grid-template-columns:1fr}.comparison iframe{height:55vh}}
</style></head><body><header><h1>סורק ההומפייג' | היום</h1><small>ארכיון צילומי דף הבית - גרסת מובייל</small></header><main><nav><label>תאריך<input type="date" id="date"></label><label>שעה<select id="hour"></select></label><button id="prev">שעה קודמת</button><button id="next">שעה הבאה</button><label><input id="compare" type="checkbox"> השוואת שעות</label><label id="compareLabel" hidden>השוואה מול<select id="compareHour"></select></label><a id="open" class="action" target="_blank" rel="noopener">פתיחת צילום בדרייב</a></nav><div id="status" role="status"></div><div id="times" class="times"></div><section id="viewer" class="viewer"></section></main><script>
const $=id=>document.getElementById(id),hours=Array.from({length:19},(_,i)=>String((i+6)%24).padStart(2,'0')+':00');let records=[];
for(const id of ['hour','compareHour'])hours.forEach(h=>$(id).add(new Option(h,h)));
const localDate=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jerusalem',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());$('date').value=new URLSearchParams(location.search).get('date')||localDate;
$('hour').value=new URLSearchParams(location.search).get('hour')||'12:00';
function selected(h){return records.find(r=>r.date===$('date').value&&r.hour===h)}
function frame(r){const d=document.createElement('div');if(!r){d.className='empty';d.textContent='אין צילום זמין לשעה שנבחרה';return d}const f=document.createElement('iframe');f.title='צילום '+r.date+' '+r.hour;f.loading='lazy';f.referrerPolicy='no-referrer';f.src='https://drive.google.com/file/d/'+encodeURIComponent(r.fileId)+'/preview';d.append(f);return d}
function render(){const h=$('hour').value,r=selected(h),viewer=$('viewer');viewer.replaceChildren();$('open').style.display=r?'':'none';if(r)$('open').href='https://drive.google.com/file/d/'+encodeURIComponent(r.fileId)+'/view';const comparison=$('compare').checked;$('compareLabel').hidden=!comparison;if(comparison){const c=document.createElement('div');c.className='comparison';c.append(frame(r),frame(selected($('compareHour').value)));viewer.append(c)}else viewer.append(frame(r));$('status').textContent=records.filter(x=>x.date===$('date').value).length+' צילומים זמינים בתאריך הנבחר';$('times').replaceChildren(...hours.map(t=>{const b=document.createElement('button');b.textContent=t;b.className=t===h?'active':'';b.style.opacity=selected(t)?1:.45;b.onclick=()=>{$('hour').value=t;render()};return b}));const u=new URL(location.href);u.searchParams.set('date',$('date').value);u.searchParams.set('hour',h);history.replaceState(null,'',u)}
$('prev').onclick=()=>{$('hour').selectedIndex=Math.max(0,$('hour').selectedIndex-1);render()};$('next').onclick=()=>{$('hour').selectedIndex=Math.min(hours.length-1,$('hour').selectedIndex+1);render()};for(const id of ['date','hour','compare','compareHour'])$(id).addEventListener('change',render);
fetch('./manifest.json?ts='+Date.now()).then(r=>{if(!r.ok)throw Error('manifest');return r.json()}).then(data=>{records=Array.isArray(data)?data:(data.captures||[]);render()}).catch(()=>{$('status').textContent='לא ניתן לטעון את אינדקס הצילומים';render()});
</script></body></html>
